services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: document_engine
      POSTGRES_USER: document_engine
      POSTGRES_PASSWORD: document_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_engine -d document_engine"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://document_engine:document_engine@postgres:5432/document_engine
      GENERATED_DOCUMENTS_DIR: /data/generated-documents
    ports:
      - "8000:8000"
    volumes:
      - generated-documents:/data/generated-documents
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "document_engine.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://document_engine:document_engine@postgres:5432/document_engine
      GENERATED_DOCUMENTS_DIR: /data/generated-documents
      WORKER_POLL_INTERVAL_SECONDS: "2"
      WORKER_BATCH_SIZE: "5"
    volumes:
      - generated-documents:/data/generated-documents
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  generated-documents:
