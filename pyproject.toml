[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aijurisdictionagents"
version = "1.0.260444"
description = "Multi-agent legal discussion scaffold."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "azure-identity>=1.23.0",
  "azure-storage-blob>=12.26.0",
  "azure-monitor-opentelemetry>=1.8.6",
  "httpx>=0.28.1",
  "langgraph==1.2.9",
  "langgraph-checkpoint-postgres==3.1.2",
  "numpy>=2.1",
  "openai>=1.0",
  "Pillow>=11.0",
  "pypdf>=6.0",
  "PyMuPDF>=1.26.0",
  "python-dotenv>=1.0",
  "psycopg[binary]>=3.2",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.27,<2",
  "sentence-transformers>=3.0",
  "truststore>=0.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.8",
  "mypy>=1.11",
]


[project.scripts]
legal-discussion = "aijurisdictionagents.cli:main"
laws-collector = "services.laws_collector.cli:main"
court-decision-collector = "services.court_decision_collector.cli:main"
document-processor = "services.document_processor.__main__:main"
local-model-builder = "services.local_model_builder.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
strict_optional = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aijurisdictionagents" = ["localization/*.json"]
