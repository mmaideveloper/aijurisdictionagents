name: ai_jurisdiction_mobile
version: 0.1.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: 0.10.5+9
  http: ^1.2.2
  path_provider: ^2.1.5
  flutter_svg: ^2.1.0
  speech_to_text: ^6.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/ai-logo.svg
    - assets/branding/hero-footer.svg
    - assets/branding/icon-ai-head.svg
    - assets/branding/icon-scale.svg
    - assets/branding/icon-doc-check.svg
    - assets/branding/icon-court.svg
