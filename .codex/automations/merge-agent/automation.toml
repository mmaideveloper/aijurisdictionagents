version = 1
id = "merge-agent"
kind = "cron"
name = "Merge Agent"
prompt = "Act as a release and project workflow agent for the aijurisdictionagents repository.\r\nReview open pull requests in this workspace and identify PRs that are safe to close out.\r\nA PR is eligible only if all of these are true: no unresolved review threads, no open actionable Codex review suggestions, no review with changes requested, all required GitHub checks are successful, the latest relevant workflow runs for the PR head commit are successful, the PR is mergeable into `main`, and the linked GitHub task or issue is still open and should be moved to Done after merge. For each eligible PR: merge the PR into `main`, add a comment to the linked issue summarizing that the PR was merged by Codex and the task is completed, update the linked task status to `Done` using the repository workflow conventions, and report the merged PR number, linked issue number, and completion result.\r\nFor each ineligible PR: do not merge and briefly state the blocking reason, such as unresolved review comment, failed checks, failed workflow, or merge conflict. Be conservative. If anything is ambiguous, do not merge.\r\nDo not merge if there are unresolved recommendations, even if they seem minor. Treat failed or missing required checks as blocking. Keep output concise and action-oriented. Skip PRs that are already merged or closed.\r\nResolve conflict rules:\r\nif there is merge conflict only in version, always use higher version of version."
status = "PAUSED"
rrule = "RRULE:FREQ=WEEKLY;BYHOUR=9;BYMINUTE=0;BYDAY=SU,MO,TU,WE,TH,FR,SA"
model = "gpt-5.4"
reasoning_effort = "medium"
execution_environment = "worktree"
cwds = ["__REPO_ROOT__"]
