name: Laws Collector Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/services/laws_collector/**"
      - "tests/test_laws_collector.py"
      - "pyproject.toml"
      - "infra/scripts/deploy_laws_collector.ps1"
      - "infra/bicep/laws_collector.job.bicep"
      - ".github/workflows/laws_collector_build_deploy.yml"
  pull_request:
    paths:
      - "src/services/laws_collector/**"
      - "tests/test_laws_collector.py"
      - "pyproject.toml"
      - "infra/scripts/deploy_laws_collector.ps1"
      - "infra/bicep/laws_collector.job.bicep"
      - ".github/workflows/laws_collector_build_deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the laws collector ACA job"
        required: false
        type: boolean
        default: true
      github_environment:
        description: "GitHub Environment that contains Azure variables"
        required: true
        default: "dev"
      image_tag:
        description: "Optional image tag override. Defaults to the commit SHA."
        required: false
        default: ""

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install root dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run laws collector unit tests
        run: pytest tests/test_laws_collector.py

      - name: Build laws collector Docker image
        run: docker build -f src/services/laws_collector/Dockerfile -t laws-collector:${{ github.sha }} .

  deploy_to_azure:
    runs-on: windows-latest
    needs: test_and_build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.github_environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_MANAGED_IDENTITY_NAME: ${{ vars.AZURE_MANAGED_IDENTITY_NAME }}
      AZURE_POSTGRES_SERVER_NAME: ${{ vars.AZURE_POSTGRES_SERVER_NAME }}
      AZURE_POSTGRES_ADMIN_USERNAME: ${{ vars.AZURE_POSTGRES_ADMIN_USERNAME }}
      AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      AZURE_LAWS_COLLECTOR_CONTAINER_APP_NAME: ${{ vars.AZURE_LAWS_COLLECTOR_CONTAINER_APP_NAME }}
      AZURE_LAWS_COLLECTOR_CRON_EXPRESSION: ${{ vars.AZURE_LAWS_COLLECTOR_CRON_EXPRESSION }}
      AZURE_LAWS_POSTGRES_DATABASE_NAME_SK: ${{ vars.AZURE_LAWS_POSTGRES_DATABASE_NAME_SK }}
      AZURE_LAWS_COLLECTOR_MAX_PROBES: ${{ vars.AZURE_LAWS_COLLECTOR_MAX_PROBES }}
      SYSTEM_EMBEDDING_MODEL_OPTION: ${{ vars.SYSTEM_EMBEDDING_MODEL_OPTION || 'cloud' }}
      SYSTEM_EMBEDDING_MODEL: ${{ vars.SYSTEM_EMBEDDING_MODEL || 'all-MiniLM-L6-v2' }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate required environment variables
        shell: pwsh
        run: |
          $required = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AZURE_RESOURCE_GROUP",
            "AZURE_LOCATION",
            "AZURE_CONTAINERAPPS_ENVIRONMENT",
            "AZURE_CONTAINER_REGISTRY",
            "AZURE_MANAGED_IDENTITY_NAME",
            "AZURE_POSTGRES_SERVER_NAME",
            "AZURE_POSTGRES_ADMIN_USERNAME",
            "AZURE_POSTGRES_ADMIN_PASSWORD"
          )

          $missing = @()
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name" -ErrorAction SilentlyContinue).Value)) {
              $missing += $name
            }
          }

          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "Missing GitHub Environment variable: $_" }
            exit 1
          }

      - name: Normalize ACR settings
        id: acr
        shell: pwsh
        run: |
          $raw = "${env:AZURE_CONTAINER_REGISTRY}"
          $lowered = $raw.Trim().ToLowerInvariant()
          if ($lowered.EndsWith(".azurecr.io")) {
            $lowered = $lowered.Substring(0, $lowered.Length - ".azurecr.io".Length)
          }
          $acrName = [regex]::Replace($lowered, "[^a-z0-9]", "")

          if ([string]::IsNullOrWhiteSpace($acrName) -or $acrName.Length -lt 5 -or $acrName.Length -gt 50) {
            Write-Error "Invalid ACR value '$raw'. Normalized name '$acrName' must be 5-50 alphanumeric characters."
          }

          if ($raw -ne $acrName -and $raw -ne "$acrName.azurecr.io") {
            Write-Host "::warning::Normalized AZURE_CONTAINER_REGISTRY from '$raw' to '$acrName'."
          }

          "acr_name=$acrName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        shell: pwsh
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy laws collector app
        shell: pwsh
        run: |
          $containerAppName = if ([string]::IsNullOrWhiteSpace($env:AZURE_LAWS_COLLECTOR_CONTAINER_APP_NAME)) {
            "laws-collector"
          } else {
            $env:AZURE_LAWS_COLLECTOR_CONTAINER_APP_NAME
          }

          $postgresDatabaseName = if ([string]::IsNullOrWhiteSpace($env:AZURE_LAWS_POSTGRES_DATABASE_NAME_SK)) {
            "laws_sk"
          } else {
            $env:AZURE_LAWS_POSTGRES_DATABASE_NAME_SK
          }

          $workerMaxProbes = if ([string]::IsNullOrWhiteSpace($env:AZURE_LAWS_COLLECTOR_MAX_PROBES)) {
            "1"
          } else {
            $env:AZURE_LAWS_COLLECTOR_MAX_PROBES
          }

          $cronExpression = if ([string]::IsNullOrWhiteSpace($env:AZURE_LAWS_COLLECTOR_CRON_EXPRESSION)) {
            "0 0 * * *"
          } else {
            $env:AZURE_LAWS_COLLECTOR_CRON_EXPRESSION
          }

          $imageTagInput = "${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}"
          $imageTag = if ([string]::IsNullOrWhiteSpace($imageTagInput)) {
            "${{ github.sha }}"
          } else {
            $imageTagInput
          }

          ./infra/scripts/deploy_laws_collector.ps1 `
            -SkipEnvFile `
            -SubscriptionId $env:AZURE_SUBSCRIPTION_ID `
            -ResourceGroupName $env:AZURE_RESOURCE_GROUP `
            -Location $env:AZURE_LOCATION `
            -ContainerAppEnvironmentName $env:AZURE_CONTAINERAPPS_ENVIRONMENT `
            -ContainerAppName $containerAppName `
            -AcrName "${{ steps.acr.outputs.acr_name }}" `
            -ManagedIdentityName $env:AZURE_MANAGED_IDENTITY_NAME `
            -PostgresServerName $env:AZURE_POSTGRES_SERVER_NAME `
            -PostgresDatabaseName $postgresDatabaseName `
            -PostgresAdminUsername $env:AZURE_POSTGRES_ADMIN_USERNAME `
            -PostgresAdminPassword $env:AZURE_POSTGRES_ADMIN_PASSWORD `
            -SystemEmbeddingModelOption $env:SYSTEM_EMBEDDING_MODEL_OPTION `
            -SystemEmbeddingModel $env:SYSTEM_EMBEDDING_MODEL `
            -CronExpression $cronExpression `
            -WorkerMaxProbes $workerMaxProbes `
            -ImageTag $imageTag
