name: core_build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/core_build.yml"
      - "pyproject.toml"
      - "api/chat-simulator-app/**"
      - "services/document-engine-service/**"
      - "scripts/**"
      - "skills/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/core_build.yml"
      - "pyproject.toml"
      - "api/chat-simulator-app/**"
      - "services/document-engine-service/**"
      - "scripts/**"
      - "skills/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          LLM_PROVIDER: mock
        run: |
          pytest

  auxiliary-service-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api/chat-simulator-app
          - services/document-engine-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  document-engine-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Python 3.13 document engine image
        run: >-
          docker build
          -f services/document-engine-service/Dockerfile
          -t document-engine-service:${{ github.sha }}
          services/document-engine-service
