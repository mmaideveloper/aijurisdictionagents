name: Self-Managed Prod Deploy

on:
  workflow_dispatch:
    inputs:
      repo_ref:
        description: "Git ref to deploy on jurisdigta-server"
        required: true
        default: "main"
      run_schema_migrations:
        description: "Run API and laws database schema migrations"
        required: true
        type: boolean
        default: true
      start_monitoring:
        description: "Start Prometheus/Grafana stack after deploy"
        required: true
        type: boolean
        default: false

jobs:
  e2e_gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/aijurisdictionfronend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/aijurisdictionfronend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests
        run: npm run test:e2e

  deploy:
    needs: e2e_gate
    runs-on: [self-hosted, Linux, X64, jurisdigta-prod]
    environment: prod
    permissions:
      contents: read
    env:
      JURISDIGTA_SSH_HOST: ${{ vars.JURISDIGTA_SSH_HOST }}
      JURISDIGTA_SSH_PORT: ${{ vars.JURISDIGTA_SSH_PORT || '22' }}
      JURISDIGTA_SSH_USER: ${{ vars.JURISDIGTA_SSH_USER || 'jurisdigta-admin' }}
      JURISDIGTA_DEPLOY_ROOT: ${{ vars.JURISDIGTA_DEPLOY_ROOT || '/srv/jurisdigta' }}
      JURISDIGTA_ENV_FILE: ${{ vars.JURISDIGTA_ENV_FILE || '/srv/jurisdigta/secrets/jurisdigta.env' }}
      JURISDIGTA_WEB_API_BASE_URL: ${{ vars.JURISDIGTA_WEB_API_BASE_URL || 'https://api.jurisdigta.eu' }}
      JURISDIGTA_MCP_PUBLIC_BASE_URL: ${{ vars.JURISDIGTA_MCP_PUBLIC_BASE_URL || 'https://mcp.jurisdigta.eu' }}
      JURISDIGTA_API_PORT: ${{ vars.JURISDIGTA_API_PORT || '8080' }}
      JURISDIGTA_MCP_PORT: ${{ vars.JURISDIGTA_MCP_PORT || '8070' }}
      JURISDIGTA_WEB_PORT: ${{ vars.JURISDIGTA_WEB_PORT || '8090' }}
      JURISDIGTA_DOCUMENT_ENGINE_ENABLED: ${{ vars.JURISDIGTA_DOCUMENT_ENGINE_ENABLED || '1' }}
      JURISDIGTA_DOCUMENT_ENGINE_API_PORT: ${{ vars.JURISDIGTA_DOCUMENT_ENGINE_API_PORT || '8060' }}
      JURISDIGTA_DOCUMENT_ENGINE_DATABASE_NAME: ${{ vars.JURISDIGTA_DOCUMENT_ENGINE_DATABASE_NAME || 'document_engine' }}
      JURISDIGTA_LAWS_COLLECTOR_RUN_MODE: ${{ vars.JURISDIGTA_LAWS_COLLECTOR_RUN_MODE || 'continuous' }}
      JURISDIGTA_INSTALL_DOCUMENT_PROCESSOR_CRON: ${{ vars.JURISDIGTA_INSTALL_DOCUMENT_PROCESSOR_CRON || '1' }}
      JURISDIGTA_DOCUMENT_PROCESSOR_CRON_EXPRESSION: ${{ vars.JURISDIGTA_DOCUMENT_PROCESSOR_CRON_EXPRESSION || '*/15 * * * *' }}
      JURISDIGTA_DOCUMENT_PROCESSOR_LIMIT: ${{ vars.JURISDIGTA_DOCUMENT_PROCESSOR_LIMIT || '20' }}
      JURISDIGTA_EMAIL_SCHEDULER_INTERVAL_SECONDS: ${{ vars.JURISDIGTA_EMAIL_SCHEDULER_INTERVAL_SECONDS || '5' }}
      JURISDIGTA_SSH_PRIVATE_KEY: ${{ secrets.JURISDIGTA_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate GitHub Environment settings
        run: |
          missing=0
          for key in JURISDIGTA_SSH_HOST JURISDIGTA_SSH_PRIVATE_KEY; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Environment variable or secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if ! printf '%s' "${{ inputs.repo_ref }}" | grep -Eq '^[A-Za-z0-9._/@+-]+$'; then
            echo "Invalid repo_ref. Use a branch, tag, or SHA containing only letters, numbers, . _ / @ + -"
            exit 1
          fi
          if ! printf '%s' "$JURISDIGTA_INSTALL_DOCUMENT_PROCESSOR_CRON" | grep -Eq '^[01]$'; then
            echo "JURISDIGTA_INSTALL_DOCUMENT_PROCESSOR_CRON must be 0 or 1"
            exit 1
          fi
          if ! printf '%s' "$JURISDIGTA_DOCUMENT_PROCESSOR_CRON_EXPRESSION" | grep -Eq '^[0-9*,/ -]+$' || [ "$(printf '%s\n' "$JURISDIGTA_DOCUMENT_PROCESSOR_CRON_EXPRESSION" | awk '{print NF}')" != "5" ]; then
            echo "JURISDIGTA_DOCUMENT_PROCESSOR_CRON_EXPRESSION must be a five-field cron expression"
            exit 1
          fi
          if ! printf '%s' "$JURISDIGTA_DOCUMENT_PROCESSOR_LIMIT" | grep -Eq '^[1-9][0-9]{0,3}$'; then
            echo "JURISDIGTA_DOCUMENT_PROCESSOR_LIMIT must be a positive integer"
            exit 1
          fi
          if ! printf '%s' "$JURISDIGTA_DOCUMENT_ENGINE_ENABLED" | grep -Eq '^[01]$'; then
            echo "JURISDIGTA_DOCUMENT_ENGINE_ENABLED must be 0 or 1"
            exit 1
          fi
          if ! printf '%s' "$JURISDIGTA_DOCUMENT_ENGINE_API_PORT" | grep -Eq '^[1-9][0-9]{1,4}$'; then
            echo "JURISDIGTA_DOCUMENT_ENGINE_API_PORT must be a valid TCP port"
            exit 1
          fi
          if [ "$JURISDIGTA_DOCUMENT_ENGINE_API_PORT" -lt 1024 ] || [ "$JURISDIGTA_DOCUMENT_ENGINE_API_PORT" -gt 65535 ]; then
            echo "JURISDIGTA_DOCUMENT_ENGINE_API_PORT must be between 1024 and 65535"
            exit 1
          fi
          if ! printf '%s' "$JURISDIGTA_DOCUMENT_ENGINE_DATABASE_NAME" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]{0,62}$'; then
            echo "JURISDIGTA_DOCUMENT_ENGINE_DATABASE_NAME must be a PostgreSQL-safe database identifier"
            exit 1
          fi
          if ! printf '%s' "$JURISDIGTA_EMAIL_SCHEDULER_INTERVAL_SECONDS" | grep -Eq '^[5-9]$|^[1-9][0-9]{1,3}$'; then
            echo "JURISDIGTA_EMAIL_SCHEDULER_INTERVAL_SECONDS must be an integer >= 5"
            exit 1
          fi
          if [ "$JURISDIGTA_LAWS_COLLECTOR_RUN_MODE" != "scheduled" ] && [ "$JURISDIGTA_LAWS_COLLECTOR_RUN_MODE" != "continuous" ]; then
            echo "JURISDIGTA_LAWS_COLLECTOR_RUN_MODE must be scheduled or continuous"
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$JURISDIGTA_SSH_PRIVATE_KEY" > ~/.ssh/jurisdigta_deploy_key
          chmod 600 ~/.ssh/jurisdigta_deploy_key
          ssh-keyscan -p "$JURISDIGTA_SSH_PORT" "$JURISDIGTA_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment script
        run: |
          scp -P "$JURISDIGTA_SSH_PORT" \
            -i ~/.ssh/jurisdigta_deploy_key \
            Deployment/server/deploy_jurisdigta_prod.sh \
            "${JURISDIGTA_SSH_USER}@${JURISDIGTA_SSH_HOST}:/tmp/deploy_jurisdigta_prod.sh"

      - name: Deploy on jurisdigta-server
        run: |
          run_schema_migrations="${{ inputs.run_schema_migrations && '1' || '0' }}"
          start_monitoring="${{ inputs.start_monitoring && '1' || '0' }}"
          ssh -p "$JURISDIGTA_SSH_PORT" \
            -i ~/.ssh/jurisdigta_deploy_key \
            "${JURISDIGTA_SSH_USER}@${JURISDIGTA_SSH_HOST}" \
            "chmod 700 /tmp/deploy_jurisdigta_prod.sh && DEPLOY_ROOT='$JURISDIGTA_DEPLOY_ROOT' ENV_FILE='$JURISDIGTA_ENV_FILE' REPO_REF='${{ inputs.repo_ref }}' WEB_API_BASE_URL='$JURISDIGTA_WEB_API_BASE_URL' API_PORT='$JURISDIGTA_API_PORT' MCP_PORT='$JURISDIGTA_MCP_PORT' WEB_PORT='$JURISDIGTA_WEB_PORT' DOCUMENT_ENGINE_ENABLED='$JURISDIGTA_DOCUMENT_ENGINE_ENABLED' DOCUMENT_ENGINE_API_PORT='$JURISDIGTA_DOCUMENT_ENGINE_API_PORT' DOCUMENT_ENGINE_DATABASE_NAME='$JURISDIGTA_DOCUMENT_ENGINE_DATABASE_NAME' RUN_SCHEMA_MIGRATIONS='$run_schema_migrations' START_MONITORING='$start_monitoring' LAWS_COLLECTOR_RUN_MODE='$JURISDIGTA_LAWS_COLLECTOR_RUN_MODE' INSTALL_DOCUMENT_PROCESSOR_CRON='$JURISDIGTA_INSTALL_DOCUMENT_PROCESSOR_CRON' DOCUMENT_PROCESSOR_CRON_EXPRESSION='$JURISDIGTA_DOCUMENT_PROCESSOR_CRON_EXPRESSION' DOCUMENT_PROCESSOR_LIMIT='$JURISDIGTA_DOCUMENT_PROCESSOR_LIMIT' EMAIL_SCHEDULER_INTERVAL_SECONDS='$JURISDIGTA_EMAIL_SCHEDULER_INTERVAL_SECONDS' /tmp/deploy_jurisdigta_prod.sh"

      - name: Verify public MCP Claude connector compatibility
        run: |
          python_bin=""
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          elif command -v python >/dev/null 2>&1; then
            python_bin="python"
          else
            echo "Python is required for MCP Claude smoke checks"
            exit 1
          fi

          "$python_bin" scripts/prod_mcp_claude_smoke.py \
            --base-url "$JURISDIGTA_MCP_PUBLIC_BASE_URL"

      - name: Summarize deployment
        run: |
          {
            echo "## Self-managed production deployment"
            echo ""
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Host | ${JURISDIGTA_SSH_HOST} |"
            echo "| User | ${JURISDIGTA_SSH_USER} |"
            echo "| Ref | ${{ inputs.repo_ref }} |"
            echo "| API | http://127.0.0.1:${JURISDIGTA_API_PORT}/health on server |"
            echo "| MCP | http://127.0.0.1:${JURISDIGTA_MCP_PORT}/health on server |"
            echo "| Public MCP Claude smoke | ${JURISDIGTA_MCP_PUBLIC_BASE_URL}/MCP |"
            echo "| Web | http://127.0.0.1:${JURISDIGTA_WEB_PORT}/health on server |"
            echo "| Document engine | ${JURISDIGTA_DOCUMENT_ENGINE_ENABLED} |"
            echo "| Document engine API | http://127.0.0.1:${JURISDIGTA_DOCUMENT_ENGINE_API_PORT}/health on server |"
            echo "| Document engine database | ${JURISDIGTA_DOCUMENT_ENGINE_DATABASE_NAME} |"
            echo "| Laws collector run mode | ${JURISDIGTA_LAWS_COLLECTOR_RUN_MODE} |"
            echo "| Document processor cron | ${JURISDIGTA_INSTALL_DOCUMENT_PROCESSOR_CRON} |"
            echo "| Document processor schedule | ${JURISDIGTA_DOCUMENT_PROCESSOR_CRON_EXPRESSION} |"
            echo "| Document processor limit | ${JURISDIGTA_DOCUMENT_PROCESSOR_LIMIT} |"
            echo "| Email scheduler interval | ${JURISDIGTA_EMAIL_SCHEDULER_INTERVAL_SECONDS}s |"
          } >> "$GITHUB_STEP_SUMMARY"
