name: API Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "api/aijuristiction-api/**"
      - ".github/workflows/api_build_deploy.yml"
  pull_request:
    paths:
      - "api/aijuristiction-api/**"
      - ".github/workflows/api_build_deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Azure Container Apps"
        required: true
        default: "true"
      github_environment:
        description: "GitHub Environment that contains Azure variables"
        required: true
        default: "dev"

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/aijuristiction-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        run: ruff check app tests

      - name: Type check
        run: mypy app

      - name: Unit tests
        run: pytest

      - name: Build Docker image
        run: docker build -t aijuristiction-api:${{ github.sha }} .

  deploy_to_azure:
    runs-on: ubuntu-latest
    needs: test_and_build
    if: inputs.deploy == 'true'
    environment: ${{ inputs.github_environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINERAPPS_ENVIRONMENT AZURE_CONTAINER_APP_NAME AZURE_CONTAINER_REGISTRY; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Environment variable: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image to ACR
        run: |
          az acr login --name $AZURE_CONTAINER_REGISTRY
          docker build -t $AZURE_CONTAINER_REGISTRY.azurecr.io/aijuristiction-api:${{ github.sha }} api/aijuristiction-api
          docker push $AZURE_CONTAINER_REGISTRY.azurecr.io/aijuristiction-api:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ env.AZURE_CONTAINER_REGISTRY }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          imageToDeploy: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/aijuristiction-api:${{ github.sha }}
