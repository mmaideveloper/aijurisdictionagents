name: API Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "api/aijuristiction-api/**"
      - ".github/workflows/api_build_deploy.yml"
  pull_request:
    paths:
      - "api/aijuristiction-api/**"
      - ".github/workflows/api_build_deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Azure Container Apps"
        required: true
        default: "true"
      github_environment:
        description: "GitHub Environment that contains Azure variables"
        required: true
        default: "dev"

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: api/aijuristiction-api
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint
        working-directory: api/aijuristiction-api
        run: ruff check app tests

      - name: Type check
        working-directory: api/aijuristiction-api
        run: mypy app

      - name: Unit tests
        working-directory: api/aijuristiction-api
        run: pytest

      - name: Build Docker image
        run: docker build -f api/aijuristiction-api/Dockerfile -t aijuristiction-api:${{ github.sha }} .

  deploy_to_azure:
    runs-on: ubuntu-latest
    needs: test_and_build
    if: inputs.deploy == 'true'
    environment: ${{ inputs.github_environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_APPLICATION_INSIGHTS_NAME: ${{ vars.AZURE_APPLICATION_INSIGHTS_NAME }}
      AZURE_POSTGRES_SERVER_NAME: ${{ vars.AZURE_POSTGRES_SERVER_NAME }}
      AZURE_POSTGRES_DATABASE_NAME: ${{ vars.AZURE_POSTGRES_DATABASE_NAME }}
      AZURE_POSTGRES_ADMIN_USERNAME: ${{ vars.AZURE_POSTGRES_ADMIN_USERNAME }}
      AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate required environment variables
        run: |
          missing=0
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINERAPPS_ENVIRONMENT AZURE_CONTAINER_APP_NAME AZURE_CONTAINER_REGISTRY AZURE_POSTGRES_SERVER_NAME AZURE_POSTGRES_DATABASE_NAME AZURE_POSTGRES_ADMIN_USERNAME AZURE_POSTGRES_ADMIN_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Environment variable: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Normalize ACR settings
        id: acr
        run: |
          raw="$AZURE_CONTAINER_REGISTRY"
          lowered="$(echo "$raw" | tr '[:upper:]' '[:lower:]')"
          no_suffix="${lowered%.azurecr.io}"
          acr_name="$(echo "$no_suffix" | tr -cd 'a-z0-9')"

          if [ -z "$acr_name" ] || [ "${#acr_name}" -lt 5 ] || [ "${#acr_name}" -gt 50 ]; then
            echo "::error::Invalid ACR value '$raw'. Normalized name '$acr_name' must be 5-50 alphanumeric characters."
            exit 1
          fi

          if [ "$raw" != "$acr_name" ] && [ "$raw" != "${acr_name}.azurecr.io" ]; then
            echo "::warning::Normalized AZURE_CONTAINER_REGISTRY from '$raw' to '$acr_name'."
          fi

          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${acr_name}.azurecr.io" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ steps.acr.outputs.acr_name }}
          docker build -f api/aijuristiction-api/Dockerfile -t ${{ steps.acr.outputs.acr_login_server }}/aijuristiction-api:${{ github.sha }} .
          docker push ${{ steps.acr.outputs.acr_login_server }}/aijuristiction-api:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ steps.acr.outputs.acr_name }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          imageToDeploy: ${{ steps.acr.outputs.acr_login_server }}/aijuristiction-api:${{ github.sha }}

      - name: Configure API database environment
        shell: bash
        run: |
          db_cloud="$(python - <<'PY'
          import os
          from urllib.parse import quote
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          admin_username = os.environ["AZURE_POSTGRES_ADMIN_USERNAME"]
          user = quote(admin_username, safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          database = os.environ["AZURE_POSTGRES_DATABASE_NAME"]
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"
          store_cloud=""
          if [ -n "${AZURE_STORAGE_ACCOUNT_NAME:-}" ] && [ -n "${AZURE_STORAGE_CONTAINER_NAME:-}" ]; then
            store_cloud="https://${AZURE_STORAGE_ACCOUNT_NAME}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER_NAME}"
          fi
          if [ -z "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}" ]; then
            app_insights_name="${AZURE_APPLICATION_INSIGHTS_NAME:-ai-juris-dev}"
            APPLICATIONINSIGHTS_CONNECTION_STRING="$(az monitor app-insights component show \
              --app "$app_insights_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query connectionString \
              --output tsv 2>/dev/null || true)"
          fi
          secret_values=("db-cloud=$db_cloud")
          if [ -n "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}" ]; then
            secret_values+=("applicationinsights-connection-string=$APPLICATIONINSIGHTS_CONNECTION_STRING")
          fi
          az containerapp secret set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets "${secret_values[@]}" \
            --only-show-errors \
            --output none

          env_vars=(
            DB_OPTION=azure
            DB_CLOUD=secretref:db-cloud
            DB_LOCAL=/tmp/api.sqlite3
            STORAGE_OPTION=azure
            STORE_LOCAL=/tmp/storage
            OTEL_SERVICE_NAME=aijuristiction-api
          )
          if [ -n "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}" ]; then
            env_vars+=(APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:applicationinsights-connection-string)
          fi
          if [ -n "$store_cloud" ]; then
            env_vars+=(STORE_CLOUD="$store_cloud")
          fi
          if [ -n "${CORS_ALLOW_ORIGINS:-}" ]; then
            env_vars+=(CORS_ALLOW_ORIGINS="$CORS_ALLOW_ORIGINS")
          fi
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars "${env_vars[@]}" \
            --only-show-errors \
            --output none

      - name: Allow GitHub runner IP on PostgreSQL firewall
        id: runner_ip
        shell: bash
        run: |
          runner_ip="$(curl -fsSL https://api.ipify.org)"
          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"
          az postgres flexible-server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_POSTGRES_SERVER_NAME" \
            --rule-name "github-runner-${GITHUB_RUN_ID}" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --only-show-errors \
            --output none

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply API schema migrations on Azure PostgreSQL
        shell: bash
        run: |
          export DB_OPTION=azure
          export DB_CLOUD="$(python - <<'PY'
          import os
          from urllib.parse import quote
          user = quote(os.environ["AZURE_POSTGRES_ADMIN_USERNAME"], safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          database = os.environ["AZURE_POSTGRES_DATABASE_NAME"]
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"
          python databases/scripts/apply_api_db_schema.py

      - name: Remove GitHub runner firewall rule
        if: always()
        shell: bash
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_POSTGRES_SERVER_NAME" \
            --rule-name "github-runner-${GITHUB_RUN_ID}" \
            --yes \
            --only-show-errors \
            --output none || true
