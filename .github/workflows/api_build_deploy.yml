name: API Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "api/aijuristiction-api/**"
      - "src/aijurisdictionagents/**"
      - "pyproject.toml"
      - "databases/**"
      - ".github/workflows/api_build_deploy.yml"
  pull_request:
    paths:
      - "api/aijuristiction-api/**"
      - "src/aijurisdictionagents/**"
      - "pyproject.toml"
      - "databases/**"
      - ".github/workflows/api_build_deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Azure Container Apps"
        required: true
        default: "true"
      github_environment:
        description: "GitHub Environment that contains Azure variables"
        required: true
        default: "dev"

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: api/aijuristiction-api
        run: |
          python -m pip install --upgrade pip
          pip install -e ../..
          pip install -e .[dev]

      - name: Lint
        working-directory: api/aijuristiction-api
        run: ruff check app tests

      - name: Type check
        working-directory: api/aijuristiction-api
        run: mypy app

      - name: Unit tests
        working-directory: api/aijuristiction-api
        run: pytest

      - name: Migration safety tests
        run: pytest tests/test_db_migration_safety.py

      - name: Build Docker image
        run: docker build -f api/aijuristiction-api/Dockerfile -t aijuristiction-api:${{ github.sha }} .

  deploy_to_azure:
    runs-on: ubuntu-latest
    needs: test_and_build
    if: github.event_name != 'workflow_dispatch' || inputs.deploy == 'true'
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.github_environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_LOG_ANALYTICS_WORKSPACE_NAME: ${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE_NAME }}
      AZURE_APPLICATION_INSIGHTS_NAME: ${{ vars.AZURE_APPLICATION_INSIGHTS_NAME }}
      AZURE_MANAGED_IDENTITY_NAME: ${{ vars.AZURE_MANAGED_IDENTITY_NAME }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDINGS_MODEL: ${{ vars.AZURE_OPENAI_EMBEDDINGS_MODEL }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      AZURE_POSTGRES_SERVER_NAME: ${{ vars.AZURE_POSTGRES_SERVER_NAME }}
      AZURE_POSTGRES_DATABASE_NAME: ${{ vars.AZURE_POSTGRES_DATABASE_NAME }}
      AZURE_LAWS_POSTGRES_DATABASE_NAME_SK: ${{ vars.AZURE_LAWS_POSTGRES_DATABASE_NAME_SK || 'laws_sk' }}
      AZURE_POSTGRES_ADMIN_USERNAME: ${{ vars.AZURE_POSTGRES_ADMIN_USERNAME }}
      AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
      CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
      DOCUMENT_PROCESSOR_OPTION: ${{ vars.DOCUMENT_PROCESSOR_OPTION || 'azure' }}
      SYSTEM_EMBEDDING_MODEL_OPTION: ${{ vars.SYSTEM_EMBEDDING_MODEL_OPTION || 'cloud' }}
      SYSTEM_EMBEDDING_MODEL: ${{ vars.SYSTEM_EMBEDDING_MODEL || 'all-MiniLM-L6-v2' }}
      EMAIL_TRANSPORT: ${{ vars.EMAIL_TRANSPORT || 'smtp' }}
      EMAIL_SENDER: ${{ vars.EMAIL_SENDER || 'no-reply@jurisdigta.eu' }}
      EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'mail.webhouse.sk' }}
      EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
      EMAIL_SMTP_USE_TLS: ${{ vars.EMAIL_SMTP_USE_TLS || 'true' }}
      EMAIL_SMTP_USERNAME: ${{ vars.EMAIL_SMTP_USERNAME || 'no-reply@jurisdigta.eu' }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      EMAIL_SCHEDULER_ENABLED: ${{ vars.EMAIL_SCHEDULER_ENABLED || 'true' }}
      EMAIL_SCHEDULER_INTERVAL_SECONDS: ${{ vars.EMAIL_SCHEDULER_INTERVAL_SECONDS || '60' }}
      CONTACT_CAPTCHA_REQUIRED: ${{ vars.CONTACT_CAPTCHA_REQUIRED }}
      CONTACT_RATE_LIMIT_MAX_REQUESTS: ${{ vars.CONTACT_RATE_LIMIT_MAX_REQUESTS }}
      CONTACT_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.CONTACT_RATE_LIMIT_WINDOW_SECONDS }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      CAR_VALIDATION_API_BASE_URL: ${{ vars.CAR_VALIDATION_API_BASE_URL }}
      CAR_VALIDATION_API_KEY: ${{ secrets.CAR_VALIDATION_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate required environment variables
        run: |
          missing=0
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINERAPPS_ENVIRONMENT AZURE_CONTAINER_APP_NAME AZURE_CONTAINER_REGISTRY AZURE_LOG_ANALYTICS_WORKSPACE_NAME AZURE_MANAGED_IDENTITY_NAME AZURE_POSTGRES_SERVER_NAME AZURE_POSTGRES_DATABASE_NAME AZURE_POSTGRES_ADMIN_USERNAME AZURE_POSTGRES_ADMIN_PASSWORD AZURE_OPENAI_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Environment variable: $key"
              missing=1
            fi
          done
          if [ "${EMAIL_TRANSPORT,,}" = "smtp" ] && [ -z "${EMAIL_SMTP_PASSWORD:-}" ]; then
            echo "Missing GitHub Environment secret: EMAIL_SMTP_PASSWORD is required when EMAIL_TRANSPORT=smtp"
            missing=1
          fi
          if [ "${CONTACT_CAPTCHA_REQUIRED,,}" = "true" ] && [ -z "${TURNSTILE_SECRET_KEY:-}" ]; then
            echo "Missing GitHub Environment secret: TURNSTILE_SECRET_KEY is required when CONTACT_CAPTCHA_REQUIRED=true"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Normalize ACR settings
        id: acr
        run: |
          raw="$AZURE_CONTAINER_REGISTRY"
          lowered="$(echo "$raw" | tr '[:upper:]' '[:lower:]')"
          no_suffix="${lowered%.azurecr.io}"
          acr_name="$(echo "$no_suffix" | tr -cd 'a-z0-9')"

          if [ -z "$acr_name" ] || [ "${#acr_name}" -lt 5 ] || [ "${#acr_name}" -gt 50 ]; then
            echo "::error::Invalid ACR value '$raw'. Normalized name '$acr_name' must be 5-50 alphanumeric characters."
            exit 1
          fi

          if [ "$raw" != "$acr_name" ] && [ "$raw" != "${acr_name}.azurecr.io" ]; then
            echo "::warning::Normalized AZURE_CONTAINER_REGISTRY from '$raw' to '$acr_name'."
          fi

          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${acr_name}.azurecr.io" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ steps.acr.outputs.acr_name }}
          docker build -f api/aijuristiction-api/Dockerfile -t ${{ steps.acr.outputs.acr_login_server }}/aijuristiction-api:${{ github.sha }} .
          docker push ${{ steps.acr.outputs.acr_login_server }}/aijuristiction-api:${{ github.sha }}

      - name: Preconfigure API secrets for existing Container App
        shell: bash
        run: |
          is_retryable_containerapp_failure() {
            local log_file="$1"
            grep -Eq \
              "ContainerAppOperationInProgress|Service Unavailable|Our services aren't available right now|JSONDecodeError|Expecting property name enclosed in double quotes" \
              "$log_file"
          }

          containerapp_exists_or_fail() {
            local max_attempts=6
            local log_file=""
            local exit_code=0

            log_file="$(mktemp)"

            for attempt in $(seq 1 "$max_attempts"); do
              set +e
              az containerapp show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --output none >"$log_file" 2>&1
              exit_code=$?
              set -e

              if [ "$exit_code" -eq 0 ]; then
                rm -f "$log_file"
                return 0
              fi

              cat "$log_file"

              if grep -q "ResourceNotFound" "$log_file"; then
                rm -f "$log_file"
                return 2
              fi

              if ! is_retryable_containerapp_failure "$log_file"; then
                echo "::error::Failed to inspect Container App '$AZURE_CONTAINER_APP_NAME'."
                rm -f "$log_file"
                return "$exit_code"
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::error::Container App lookup kept failing after $max_attempts attempts."
                rm -f "$log_file"
                return "$exit_code"
              fi

              sleep_seconds=$((attempt * 10))
              echo "::warning::Container App lookup failed with a transient ACA/ARM error; retrying in ${sleep_seconds}s (attempt $attempt/$max_attempts)."
              sleep "$sleep_seconds"
            done

            rm -f "$log_file"
            return 1
          }

          retry_containerapp_command() {
            local description="$1"
            shift
            local max_attempts=8
            local log_file=""
            local exit_code=0

            log_file="$(mktemp)"

            for attempt in $(seq 1 "$max_attempts"); do
              set +e
              "$@" >"$log_file" 2>&1
              exit_code=$?
              set -e

              cat "$log_file"
              if [ "$exit_code" -eq 0 ]; then
                rm -f "$log_file"
                return 0
              fi

              if ! is_retryable_containerapp_failure "$log_file"; then
                rm -f "$log_file"
                return "$exit_code"
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::error::$description kept failing after $max_attempts attempts."
                rm -f "$log_file"
                return "$exit_code"
              fi

              sleep_seconds=$((attempt * 10))
              echo "::warning::$description hit a transient ACA/ARM failure; retrying in ${sleep_seconds}s (attempt $attempt/$max_attempts)."
              sleep "$sleep_seconds"
            done

            rm -f "$log_file"
            return 1
          }

          set +e
          containerapp_exists_or_fail
          exists_status=$?
          set -e
          if [ "$exists_status" -eq 2 ]; then
            echo "Container App '$AZURE_CONTAINER_APP_NAME' does not exist yet; skipping secret preconfiguration."
            exit 0
          fi
          if [ "$exists_status" -ne 0 ]; then
            exit "$exists_status"
          fi

          db_cloud="$(python - <<'PY'
          import os
          from urllib.parse import quote
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          admin_username = os.environ["AZURE_POSTGRES_ADMIN_USERNAME"]
          user = quote(admin_username, safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          database = os.environ["AZURE_POSTGRES_DATABASE_NAME"]
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"
          laws_db_cloud="$(python - <<'PY'
          import os
          from urllib.parse import quote
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          admin_username = os.environ["AZURE_POSTGRES_ADMIN_USERNAME"]
          user = quote(admin_username, safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          database = os.environ["AZURE_LAWS_POSTGRES_DATABASE_NAME_SK"]
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"

          resolved_app_insights="${APPLICATIONINSIGHTS_CONNECTION_STRING:-}"
          if [ -z "$resolved_app_insights" ]; then
            app_insights_name="${AZURE_APPLICATION_INSIGHTS_NAME:-ai-juris-dev}"
            resolved_app_insights="$(az monitor app-insights component show \
              --app "$app_insights_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query connectionString \
              --output tsv 2>/dev/null || true)"
          fi

          secret_values=("db-cloud=$db_cloud" "laws-db-cloud=$laws_db_cloud")
          if [ -n "$resolved_app_insights" ]; then
            secret_values+=("applicationinsights-connection-string=$resolved_app_insights")
          fi
          if [ -n "${AZURE_OPENAI_API_KEY:-}" ]; then
            secret_values+=("azure-openai-api-key=$AZURE_OPENAI_API_KEY")
          fi
          if [ -n "${EMAIL_SMTP_PASSWORD:-}" ]; then
            secret_values+=("email-smtp-password=$EMAIL_SMTP_PASSWORD")
          fi
          if [ -n "${CAR_VALIDATION_API_KEY:-}" ]; then
            secret_values+=("car-validation-api-key=$CAR_VALIDATION_API_KEY")
          fi
          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
            secret_values+=("turnstile-secret-key=$TURNSTILE_SECRET_KEY")
          fi

          retry_containerapp_command "Preconfiguring Container App secrets" \
            az containerapp secret set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets "${secret_values[@]}" \
            --only-show-errors \
            --output none

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ steps.acr.outputs.acr_name }}
          containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          imageToDeploy: ${{ steps.acr.outputs.acr_login_server }}/aijuristiction-api:${{ github.sha }}

      - name: Wait for Container App provisioning to settle
        shell: bash
        run: |
          wait_for_container_app_ready() {
            local attempts="${1:-30}"
            local sleep_seconds="${2:-10}"
            local state=""
            for attempt in $(seq 1 "$attempts"); do
              state="$(az containerapp show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --query properties.provisioningState \
                --output tsv 2>/dev/null || true)"
              if [ "$state" = "Succeeded" ]; then
                echo "Container App provisioning state is Succeeded."
                return 0
              fi
              if [ -n "$state" ]; then
                echo "Container App provisioning state: $state (attempt $attempt/$attempts)"
              else
                echo "Container App provisioning state unavailable yet (attempt $attempt/$attempts)"
              fi
              sleep "$sleep_seconds"
            done

            echo "::error::Container App '$AZURE_CONTAINER_APP_NAME' did not reach provisioningState=Succeeded."
            az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --output jsonc || true
            return 1
          }

          wait_for_container_app_ready

      - name: Configure API database environment
        shell: bash
        run: |
          wait_for_container_app_ready() {
            local attempts="${1:-18}"
            local sleep_seconds="${2:-10}"
            local state=""
            for attempt in $(seq 1 "$attempts"); do
              state="$(az containerapp show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --query properties.provisioningState \
                --output tsv 2>/dev/null || true)"
              if [ "$state" = "Succeeded" ]; then
                return 0
              fi
              if [ -n "$state" ]; then
                echo "Waiting for Container App provisioning state to settle: $state (attempt $attempt/$attempts)"
              else
                echo "Waiting for Container App provisioning state to become available (attempt $attempt/$attempts)"
              fi
              sleep "$sleep_seconds"
            done

            echo "::error::Container App '$AZURE_CONTAINER_APP_NAME' did not become ready for configuration."
            az containerapp show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --output jsonc || true
            return 1
          }

          retry_containerapp_command() {
            local description="$1"
            shift
            local max_attempts=8
            local log_file=""
            local exit_code=0

            log_file="$(mktemp)"

            for attempt in $(seq 1 "$max_attempts"); do
              wait_for_container_app_ready

              set +e
              "$@" >"$log_file" 2>&1
              exit_code=$?
              set -e

              cat "$log_file"
              if [ "$exit_code" -eq 0 ]; then
                wait_for_container_app_ready
                rm -f "$log_file"
                return 0
              fi

              if ! grep -Eq "ContainerAppOperationInProgress|Service Unavailable|Our services aren't available right now|JSONDecodeError|Expecting property name enclosed in double quotes" "$log_file"; then
                rm -f "$log_file"
                return "$exit_code"
              fi

              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::error::$description failed after $max_attempts retry attempts."
                rm -f "$log_file"
                return "$exit_code"
              fi

              sleep_seconds=$((attempt * 10))
              echo "::warning::$description hit a transient ACA/ARM failure; retrying in ${sleep_seconds}s (attempt $attempt/$max_attempts)."
              sleep "$sleep_seconds"
            done

            rm -f "$log_file"
          }

          db_cloud="$(python - <<'PY'
          import os
          from urllib.parse import quote
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          admin_username = os.environ["AZURE_POSTGRES_ADMIN_USERNAME"]
          user = quote(admin_username, safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          database = os.environ["AZURE_POSTGRES_DATABASE_NAME"]
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"
          laws_db_cloud="$(python - <<'PY'
          import os
          from urllib.parse import quote
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          admin_username = os.environ["AZURE_POSTGRES_ADMIN_USERNAME"]
          user = quote(admin_username, safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          database = os.environ["AZURE_LAWS_POSTGRES_DATABASE_NAME_SK"]
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"
          store_cloud=""
          if [ -n "${AZURE_STORAGE_ACCOUNT_NAME:-}" ] && [ -n "${AZURE_STORAGE_CONTAINER_NAME:-}" ]; then
            store_cloud="https://${AZURE_STORAGE_ACCOUNT_NAME}.blob.core.windows.net/${AZURE_STORAGE_CONTAINER_NAME}"
          fi
          if [ -z "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}" ]; then
            app_insights_name="${AZURE_APPLICATION_INSIGHTS_NAME:-ai-juris-dev}"
            APPLICATIONINSIGHTS_CONNECTION_STRING="$(az monitor app-insights component show \
              --app "$app_insights_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query connectionString \
              --output tsv 2>/dev/null || true)"
          fi
          app_insights_query_client_id="$(az identity show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_MANAGED_IDENTITY_NAME" \
            --query clientId \
            --output tsv 2>/dev/null || true)"
          secret_values=("db-cloud=$db_cloud" "laws-db-cloud=$laws_db_cloud")
          if [ -n "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}" ]; then
            secret_values+=("applicationinsights-connection-string=$APPLICATIONINSIGHTS_CONNECTION_STRING")
          fi
          if [ -n "${AZURE_OPENAI_API_KEY:-}" ]; then
            secret_values+=("azure-openai-api-key=$AZURE_OPENAI_API_KEY")
          fi
          if [ -n "${EMAIL_SMTP_PASSWORD:-}" ]; then
            secret_values+=("email-smtp-password=$EMAIL_SMTP_PASSWORD")
          fi
          if [ -n "${CAR_VALIDATION_API_KEY:-}" ]; then
            secret_values+=("car-validation-api-key=$CAR_VALIDATION_API_KEY")
          fi
          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
            secret_values+=("turnstile-secret-key=$TURNSTILE_SECRET_KEY")
          fi
          retry_containerapp_command "Setting Container App secrets" \
            az containerapp secret set \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --secrets "${secret_values[@]}" \
            --only-show-errors \
            --output none

          env_vars=(
            DB_OPTION=azure
            DB_CLOUD=secretref:db-cloud
            DB_LOCAL=/tmp/api.sqlite3
            LAWS_COUNTRY=SK
            LAWS_DB_BACKEND=postgres
            LAWS_DB_CLOUD=secretref:laws-db-cloud
            STORAGE_OPTION=azure
            STORE_LOCAL=/tmp/storage
            LLM_PROVIDER=${LLM_PROVIDER:-azurefoundry}
            DOCUMENT_PROCESSOR_OPTION=${DOCUMENT_PROCESSOR_OPTION:-azure}
            SYSTEM_EMBEDDING_MODEL_OPTION=${SYSTEM_EMBEDDING_MODEL_OPTION:-cloud}
            SYSTEM_EMBEDDING_MODEL=${SYSTEM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
            EMAIL_DB_OPTION=azure
            EMAIL_DB_CLOUD=secretref:db-cloud
            EMAIL_DB_LOCAL=/tmp/email.sqlite3
            EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-smtp}
            EMAIL_SENDER=${EMAIL_SENDER:-no-reply@jurisdigta.eu}
            EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST:-mail.webhouse.sk}
            EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT:-587}
            EMAIL_SMTP_USE_TLS=${EMAIL_SMTP_USE_TLS:-true}
            EMAIL_SMTP_USERNAME=${EMAIL_SMTP_USERNAME:-no-reply@jurisdigta.eu}
            EMAIL_SCHEDULER_ENABLED=${EMAIL_SCHEDULER_ENABLED:-true}
            EMAIL_SCHEDULER_INTERVAL_SECONDS=${EMAIL_SCHEDULER_INTERVAL_SECONDS:-60}
            OTEL_SERVICE_NAME=aijuristiction-api
          )
          if [ -n "${EMAIL_SMTP_PASSWORD:-}" ]; then
            env_vars+=(EMAIL_SMTP_PASSWORD=secretref:email-smtp-password)
          fi
          if [ -n "${CONTACT_CAPTCHA_REQUIRED:-}" ]; then
            env_vars+=(CONTACT_CAPTCHA_REQUIRED="$CONTACT_CAPTCHA_REQUIRED")
          fi
          if [ -n "${CONTACT_RATE_LIMIT_MAX_REQUESTS:-}" ]; then
            env_vars+=(CONTACT_RATE_LIMIT_MAX_REQUESTS="$CONTACT_RATE_LIMIT_MAX_REQUESTS")
          fi
          if [ -n "${CONTACT_RATE_LIMIT_WINDOW_SECONDS:-}" ]; then
            env_vars+=(CONTACT_RATE_LIMIT_WINDOW_SECONDS="$CONTACT_RATE_LIMIT_WINDOW_SECONDS")
          fi
          if [ -n "${TURNSTILE_SECRET_KEY:-}" ]; then
            env_vars+=(TURNSTILE_SECRET_KEY=secretref:turnstile-secret-key)
          fi
          if [ -n "${CAR_VALIDATION_API_BASE_URL:-}" ]; then
            env_vars+=(CAR_VALIDATION_API_BASE_URL="$CAR_VALIDATION_API_BASE_URL")
          fi
          if [ -n "${CAR_VALIDATION_API_KEY:-}" ]; then
            env_vars+=(CAR_VALIDATION_API_KEY=secretref:car-validation-api-key)
          fi
          if [ -n "${AZURE_OPENAI_ENDPOINT:-}" ]; then
            env_vars+=(AZURE_OPENAI_ENDPOINT="$AZURE_OPENAI_ENDPOINT")
          fi
          if [ -n "${AZURE_OPENAI_DEPLOYMENT:-}" ]; then
            env_vars+=(AZURE_OPENAI_DEPLOYMENT="$AZURE_OPENAI_DEPLOYMENT")
          fi
          if [ -n "${AZURE_OPENAI_EMBEDDINGS_MODEL:-}" ]; then
            env_vars+=(AZURE_OPENAI_EMBEDDINGS_MODEL="$AZURE_OPENAI_EMBEDDINGS_MODEL")
          fi
          if [ -n "${AZURE_OPENAI_API_VERSION:-}" ]; then
            env_vars+=(AZURE_OPENAI_API_VERSION="$AZURE_OPENAI_API_VERSION")
          fi
          if [ -n "${AZURE_OPENAI_API_KEY:-}" ]; then
            env_vars+=(AZURE_OPENAI_API_KEY=secretref:azure-openai-api-key)
          fi
          if [ -n "${APPLICATIONINSIGHTS_CONNECTION_STRING:-}" ]; then
            env_vars+=(APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:applicationinsights-connection-string)
          fi
          env_vars+=(AZURE_LOG_ANALYTICS_WORKSPACE_NAME="${AZURE_LOG_ANALYTICS_WORKSPACE_NAME:-}")
          env_vars+=(AZURE_MANAGED_IDENTITY_NAME="${AZURE_MANAGED_IDENTITY_NAME:-}")
          env_vars+=(AZURE_RESOURCE_GROUP="$AZURE_RESOURCE_GROUP")
          env_vars+=(AZURE_SUBSCRIPTION_ID="$AZURE_SUBSCRIPTION_ID")
          if [ -n "$app_insights_query_client_id" ]; then
            env_vars+=(AZURE_CLIENT_ID="$app_insights_query_client_id")
          fi
          if [ -n "$store_cloud" ]; then
            env_vars+=(STORE_CLOUD="$store_cloud")
          fi
          if [ -n "${CORS_ALLOW_ORIGINS:-}" ]; then
            env_vars+=(CORS_ALLOW_ORIGINS="$CORS_ALLOW_ORIGINS")
          fi
          retry_containerapp_command "Updating Container App environment variables" \
            az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars "${env_vars[@]}" \
            --only-show-errors \
            --output none

      - name: Allow GitHub runner IP on PostgreSQL firewall
        id: runner_ip
        shell: bash
        run: |
          runner_ip="$(curl -fsSL https://api.ipify.org)"
          echo "runner_ip=$runner_ip" >> "$GITHUB_OUTPUT"
          az postgres flexible-server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server-name "$AZURE_POSTGRES_SERVER_NAME" \
            --name "github-runner-${GITHUB_RUN_ID}" \
            --start-ip-address "$runner_ip" \
            --end-ip-address "$runner_ip" \
            --only-show-errors \
            --output none

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply API schema migrations on Azure PostgreSQL
        shell: bash
        run: |
          export DB_OPTION=azure
          export DB_CLOUD="$(python - <<'PY'
          import os
          from urllib.parse import quote
          user = quote(os.environ["AZURE_POSTGRES_ADMIN_USERNAME"], safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          database = os.environ["AZURE_POSTGRES_DATABASE_NAME"]
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"
          python scripts/databases/apply_api_db_schema.py

      - name: Summarize ACA deployment
        shell: bash
        run: |
          fqdn="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)"
          endpoint="n/a"
          if [ -n "$fqdn" ]; then
            endpoint="https://$fqdn"
          fi

          {
            echo "## ACA deployment summary"
            echo ""
            echo "| Resource | Name | Result | Endpoint |"
            echo "| --- | --- | --- | --- |"
            echo "| Managed environment | $AZURE_CONTAINERAPPS_ENVIRONMENT | reused | n/a |"
            echo "| API container app | $AZURE_CONTAINER_APP_NAME | updated | $endpoint |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove GitHub runner firewall rule
        if: always()
        shell: bash
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server-name "$AZURE_POSTGRES_SERVER_NAME" \
            --name "github-runner-${GITHUB_RUN_ID}" \
            --yes \
            --only-show-errors \
            --output none || true
