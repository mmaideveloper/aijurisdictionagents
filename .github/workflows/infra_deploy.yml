name: infra_deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy infrastructure to Azure"
        required: true
        default: "true"
      github_environment:
        description: "GitHub Environment that contains Azure variables"
        required: true
        default: "dev"

jobs:
  validate_bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Bicep template compiles
        run: az bicep build --file infra/bicep/main.bicep

  deploy_infrastructure:
    runs-on: ubuntu-latest
    needs: validate_bicep
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'true'
    environment: ${{ inputs.github_environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_FRONTEND_CONTAINER_APP_NAME: ${{ vars.AZURE_FRONTEND_CONTAINER_APP_NAME }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      AZURE_POSTGRES_SERVER_NAME: ${{ vars.AZURE_POSTGRES_SERVER_NAME }}
      AZURE_POSTGRES_DATABASE_NAME: ${{ vars.AZURE_POSTGRES_DATABASE_NAME }}
      AZURE_POSTGRES_ADMIN_USERNAME: ${{ vars.AZURE_POSTGRES_ADMIN_USERNAME }}
      AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
      AZURE_POSTGRES_SKU_NAME: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
      AZURE_POSTGRES_SKU_TIER: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
      AZURE_POSTGRES_VERSION: ${{ vars.AZURE_POSTGRES_VERSION }}
      AZURE_POSTGRES_STORAGE_SIZE_GB: ${{ vars.AZURE_POSTGRES_STORAGE_SIZE_GB }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_LOG_ANALYTICS_WORKSPACE_NAME: ${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE_NAME }}
      AZURE_APPLICATION_INSIGHTS_NAME: ${{ vars.AZURE_APPLICATION_INSIGHTS_NAME }}
      AZURE_MANAGED_IDENTITY_NAME: ${{ vars.AZURE_MANAGED_IDENTITY_NAME }}
      AZURE_DOCUMENT_PROCESSOR_JOB_NAME: ${{ vars.AZURE_DOCUMENT_PROCESSOR_JOB_NAME }}
      AZURE_DOCUMENT_PROCESSOR_CRON_EXPRESSION: ${{ vars.AZURE_DOCUMENT_PROCESSOR_CRON_EXPRESSION }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      SYSTEM_EMBEDDING_MODEL_OPTION: ${{ vars.SYSTEM_EMBEDDING_MODEL_OPTION || 'local' }}
      SYSTEM_EMBEDDING_MODEL: ${{ vars.SYSTEM_EMBEDDING_MODEL || 'all-MiniLM-L6-v2' }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_EMBEDDINGS_MODEL: ${{ vars.AZURE_OPENAI_EMBEDDINGS_MODEL }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_LAWS_COLLECTOR_CONTAINER_APP_NAME: ${{ vars.AZURE_LAWS_COLLECTOR_CONTAINER_APP_NAME }}
      AZURE_LAWS_COLLECTOR_CRON_EXPRESSION: ${{ vars.AZURE_LAWS_COLLECTOR_CRON_EXPRESSION }}
      AZURE_LAWS_COLLECTOR_MAX_PROBES: ${{ vars.AZURE_LAWS_COLLECTOR_MAX_PROBES }}
      AZURE_LAWS_POSTGRES_DATABASE_NAME_SK: ${{ vars.AZURE_LAWS_POSTGRES_DATABASE_NAME_SK }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_LOCATION AZURE_CONTAINERAPPS_ENVIRONMENT AZURE_CONTAINER_APP_NAME AZURE_FRONTEND_CONTAINER_APP_NAME AZURE_CONTAINER_REGISTRY AZURE_LOG_ANALYTICS_WORKSPACE_NAME AZURE_MANAGED_IDENTITY_NAME AZURE_POSTGRES_SERVER_NAME AZURE_POSTGRES_DATABASE_NAME AZURE_POSTGRES_ADMIN_USERNAME AZURE_POSTGRES_ADMIN_PASSWORD AZURE_OPENAI_ENDPOINT AZURE_OPENAI_API_KEY; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Environment variable: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Normalize ACR settings
        id: acr
        run: |
          raw="$AZURE_CONTAINER_REGISTRY"
          lowered="$(echo "$raw" | tr '[:upper:]' '[:lower:]')"
          no_suffix="${lowered%.azurecr.io}"
          acr_name="$(echo "$no_suffix" | tr -cd 'a-z0-9')"

          if [ -z "$acr_name" ] || [ "${#acr_name}" -lt 5 ] || [ "${#acr_name}" -gt 50 ]; then
            echo "::error::Invalid ACR value '$raw'. Normalized name '$acr_name' must be 5-50 alphanumeric characters."
            exit 1
          fi

          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Ensure resource group exists
        run: |
          if [ "$(az group exists --name "$AZURE_RESOURCE_GROUP" --output tsv)" != "true" ]; then
            az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION" --only-show-errors --output none
          fi

      - name: Resolve Application Insights name
        id: appinsights
        run: |
          app_insights_name="${AZURE_APPLICATION_INSIGHTS_NAME:-ai-juris-dev}"
          echo "application_insights_name=$app_insights_name" >> "$GITHUB_OUTPUT"

      - name: Resolve storage settings
        id: storage
        run: |
          storage_account="$AZURE_STORAGE_ACCOUNT_NAME"
          storage_container="$AZURE_STORAGE_CONTAINER_NAME"

          if [ -z "$storage_account" ]; then
            seed="$(echo -n "$AZURE_RESOURCE_GROUP" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"
            [ -z "$seed" ] && seed="aijur"
            prefix="$(echo -n "$seed" | cut -c1-10)"
            hash_suffix="$(echo -n "$AZURE_RESOURCE_GROUP" | sha256sum | cut -c1-10)"
            storage_account="st${prefix}${hash_suffix}"
          fi

          storage_account="$(echo -n "$storage_account" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-24)"
          if [ "${#storage_account}" -lt 3 ]; then
            storage_account="${storage_account}stg"
            storage_account="$(echo -n "$storage_account" | cut -c1-3)"
          fi

          if [ -z "$storage_container" ]; then
            storage_container="case-documents"
          fi
          storage_container="$(echo -n "$storage_container" | tr '[:upper:]' '[:lower:]')"

          echo "storage_account_name=$storage_account" >> "$GITHUB_OUTPUT"
          echo "storage_container_name=$storage_container" >> "$GITHUB_OUTPUT"

      - name: Resolve laws collector settings
        id: laws
        run: |
          normalize_aca_cron() {
            local value="$1"
            local default_value="$2"
            local resolved="$value"

            if [ -z "$resolved" ]; then
              resolved="$default_value"
            fi

            read -r -a parts <<< "$resolved"
            if [ "${#parts[@]}" -eq 6 ]; then
              if [ "${parts[0]}" != "0" ]; then
                echo "::error::ACA Jobs require a 5-field cron expression. If a legacy 6-field value is used, the first field must be 0 seconds."
                exit 1
              fi
              resolved="${parts[1]} ${parts[2]} ${parts[3]} ${parts[4]} ${parts[5]}"
              echo "Normalized ACA cron expression from 6 fields to 5 fields: $resolved"
              read -r -a parts <<< "$resolved"
            fi

            if [ "${#parts[@]}" -ne 5 ]; then
              echo "::error::ACA Jobs require a 5-field cron expression. Received: $resolved"
              exit 1
            fi

            printf '%s\n' "$resolved"
          }

          laws_job_name="${AZURE_LAWS_COLLECTOR_CONTAINER_APP_NAME:-laws-collector}"
          laws_cron_expression="$(normalize_aca_cron "${AZURE_LAWS_COLLECTOR_CRON_EXPRESSION:-}" "0 0 * * *")"
          laws_max_probes="${AZURE_LAWS_COLLECTOR_MAX_PROBES:-1}"
          laws_postgres_database="${AZURE_LAWS_POSTGRES_DATABASE_NAME_SK:-laws_sk}"

          echo "laws_job_name=$laws_job_name" >> "$GITHUB_OUTPUT"
          echo "laws_cron_expression=$laws_cron_expression" >> "$GITHUB_OUTPUT"
          echo "laws_max_probes=$laws_max_probes" >> "$GITHUB_OUTPUT"
          echo "laws_postgres_database_name=$laws_postgres_database" >> "$GITHUB_OUTPUT"

      - name: Resolve document processor settings
        id: documentprocessor
        run: |
          normalize_aca_cron() {
            local value="$1"
            local default_value="$2"
            local resolved="$value"

            if [ -z "$resolved" ]; then
              resolved="$default_value"
            fi

            read -r -a parts <<< "$resolved"
            if [ "${#parts[@]}" -eq 6 ]; then
              if [ "${parts[0]}" != "0" ]; then
                echo "::error::ACA Jobs require a 5-field cron expression. If a legacy 6-field value is used, the first field must be 0 seconds."
                exit 1
              fi
              resolved="${parts[1]} ${parts[2]} ${parts[3]} ${parts[4]} ${parts[5]}"
              echo "Normalized ACA cron expression from 6 fields to 5 fields: $resolved"
              read -r -a parts <<< "$resolved"
            fi

            if [ "${#parts[@]}" -ne 5 ]; then
              echo "::error::ACA Jobs require a 5-field cron expression. Received: $resolved"
              exit 1
            fi

            printf '%s\n' "$resolved"
          }

          document_processor_job="${AZURE_DOCUMENT_PROCESSOR_JOB_NAME:-document-processor}"
          document_processor_cron="$(normalize_aca_cron "${AZURE_DOCUMENT_PROCESSOR_CRON_EXPRESSION:-}" "*/15 * * * *")"
          llm_provider="${LLM_PROVIDER:-azurefoundry}"
          system_embedding_model_option="${SYSTEM_EMBEDDING_MODEL_OPTION:-local}"
          system_embedding_model="${SYSTEM_EMBEDDING_MODEL:-all-MiniLM-L6-v2}"
          azure_openai_embeddings_model="${AZURE_OPENAI_EMBEDDINGS_MODEL:-text-embedding-3-large}"
          azure_openai_api_version="${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}"

          echo "document_processor_job_name=$document_processor_job" >> "$GITHUB_OUTPUT"
          echo "document_processor_cron_expression=$document_processor_cron" >> "$GITHUB_OUTPUT"
          echo "llm_provider=$llm_provider" >> "$GITHUB_OUTPUT"
          echo "system_embedding_model_option=$system_embedding_model_option" >> "$GITHUB_OUTPUT"
          echo "system_embedding_model=$system_embedding_model" >> "$GITHUB_OUTPUT"
          echo "azure_openai_embeddings_model=$azure_openai_embeddings_model" >> "$GITHUB_OUTPUT"
          echo "azure_openai_api_version=$azure_openai_api_version" >> "$GITHUB_OUTPUT"

      - name: Detect existing resources and resolve deployment mode
        id: existing
        run: |
          get_location() {
            az resource show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$1" \
              --resource-type "$2" \
              --query location \
              --output tsv 2>/dev/null || true
          }

          log_location="$(get_location "$AZURE_LOG_ANALYTICS_WORKSPACE_NAME" "Microsoft.OperationalInsights/workspaces")"
          env_location="$(get_location "$AZURE_CONTAINERAPPS_ENVIRONMENT" "Microsoft.App/managedEnvironments")"
          acr_location="$(get_location "${{ steps.acr.outputs.acr_name }}" "Microsoft.ContainerRegistry/registries")"
          storage_location="$(get_location "${{ steps.storage.outputs.storage_account_name }}" "Microsoft.Storage/storageAccounts")"
          app_insights_location="$(get_location "${{ steps.appinsights.outputs.application_insights_name }}" "Microsoft.Insights/components")"
          identity_location="$(get_location "$AZURE_MANAGED_IDENTITY_NAME" "Microsoft.ManagedIdentity/userAssignedIdentities")"
          postgres_location="$(get_location "$AZURE_POSTGRES_SERVER_NAME" "Microsoft.DBforPostgreSQL/flexibleServers")"
          app_location="$(get_location "$AZURE_CONTAINER_APP_NAME" "Microsoft.App/containerApps")"
          frontend_location="$(get_location "$AZURE_FRONTEND_CONTAINER_APP_NAME" "Microsoft.App/containerApps")"
          document_processor_location="$(get_location "${{ steps.documentprocessor.outputs.document_processor_job_name }}" "Microsoft.App/jobs")"
          laws_collector_location="$(get_location "${{ steps.laws.outputs.laws_job_name }}" "Microsoft.App/jobs")"

          create_log_analytics_workspace=true
          create_managed_environment=true
          create_acr=true
          create_storage_account=true
          create_application_insights=true
          create_managed_identity=true
          create_postgres_server=true
          create_container_app=true
          create_frontend_container_app=true
          create_document_processor_job=true
          create_laws_collector_job=true

          [ -n "$log_location" ] && create_log_analytics_workspace=false
          [ -n "$env_location" ] && create_managed_environment=false
          [ -n "$acr_location" ] && create_acr=false
          [ -n "$storage_location" ] && create_storage_account=false
          [ -n "$app_insights_location" ] && create_application_insights=false
          [ -n "$identity_location" ] && create_managed_identity=false
          [ -n "$postgres_location" ] && create_postgres_server=false
          [ -n "$app_location" ] && create_container_app=false
          [ -n "$frontend_location" ] && create_frontend_container_app=false
          [ -n "$document_processor_location" ] && create_document_processor_job=false
          [ -n "$laws_collector_location" ] && create_laws_collector_job=false

          resolved_location="$AZURE_LOCATION"

          echo "resolved_location=$resolved_location" >> "$GITHUB_OUTPUT"
          echo "create_log_analytics_workspace=$create_log_analytics_workspace" >> "$GITHUB_OUTPUT"
          echo "create_managed_environment=$create_managed_environment" >> "$GITHUB_OUTPUT"
          echo "create_acr=$create_acr" >> "$GITHUB_OUTPUT"
          echo "create_storage_account=$create_storage_account" >> "$GITHUB_OUTPUT"
          echo "create_application_insights=$create_application_insights" >> "$GITHUB_OUTPUT"
          echo "create_managed_identity=$create_managed_identity" >> "$GITHUB_OUTPUT"
          echo "create_postgres_server=$create_postgres_server" >> "$GITHUB_OUTPUT"
          echo "create_container_app=$create_container_app" >> "$GITHUB_OUTPUT"
          echo "create_frontend_container_app=$create_frontend_container_app" >> "$GITHUB_OUTPUT"
          echo "create_document_processor_job=$create_document_processor_job" >> "$GITHUB_OUTPUT"
          echo "create_laws_collector_job=$create_laws_collector_job" >> "$GITHUB_OUTPUT"

      - name: Deploy infrastructure from Bicep
        run: |
          postgres_connection_string="$(python - <<'PY'
          import os
          from urllib.parse import quote
          user = quote(os.environ["AZURE_POSTGRES_ADMIN_USERNAME"], safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          database = os.environ["AZURE_POSTGRES_DATABASE_NAME"]
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"
          laws_postgres_connection_string="$(python - <<'PY'
          import os
          from urllib.parse import quote
          user = quote(os.environ["AZURE_POSTGRES_ADMIN_USERNAME"], safe="")
          password = quote(os.environ["AZURE_POSTGRES_ADMIN_PASSWORD"], safe="")
          server = os.environ["AZURE_POSTGRES_SERVER_NAME"]
          database = os.environ.get("AZURE_LAWS_POSTGRES_DATABASE_NAME_SK") or "laws_sk"
          print(f"postgresql://{user}:{password}@{server}.postgres.database.azure.com:5432/{database}?sslmode=require")
          PY
          )"
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "infra-${{ github.run_id }}-${{ github.run_attempt }}" \
            --template-file infra/bicep/main.bicep \
            --parameters \
              location="${{ steps.existing.outputs.resolved_location }}" \
              environmentName="$AZURE_CONTAINERAPPS_ENVIRONMENT" \
              containerAppName="$AZURE_CONTAINER_APP_NAME" \
              frontendContainerAppName="$AZURE_FRONTEND_CONTAINER_APP_NAME" \
              documentProcessorJobName="${{ steps.documentprocessor.outputs.document_processor_job_name }}" \
              documentProcessorCronExpression="${{ steps.documentprocessor.outputs.document_processor_cron_expression }}" \
              lawsCollectorJobName="${{ steps.laws.outputs.laws_job_name }}" \
              lawsCollectorCronExpression="${{ steps.laws.outputs.laws_cron_expression }}" \
              lawsCollectorMaxProbes="${{ steps.laws.outputs.laws_max_probes }}" \
              postgresServerName="$AZURE_POSTGRES_SERVER_NAME" \
              postgresDatabaseName="$AZURE_POSTGRES_DATABASE_NAME" \
              lawsPostgresDatabaseName="${{ steps.laws.outputs.laws_postgres_database_name }}" \
              postgresAdminUsername="$AZURE_POSTGRES_ADMIN_USERNAME" \
              postgresAdminPassword="$AZURE_POSTGRES_ADMIN_PASSWORD" \
              postgresConnectionString="$postgres_connection_string" \
              lawsPostgresConnectionString="$laws_postgres_connection_string" \
              postgresSkuName="${AZURE_POSTGRES_SKU_NAME:-Standard_B1ms}" \
              postgresSkuTier="${AZURE_POSTGRES_SKU_TIER:-Burstable}" \
              postgresVersion="${AZURE_POSTGRES_VERSION:-16}" \
              postgresStorageSizeGb="${AZURE_POSTGRES_STORAGE_SIZE_GB:-32}" \
              llmProvider="${{ steps.documentprocessor.outputs.llm_provider }}" \
              systemEmbeddingModelOption="${{ steps.documentprocessor.outputs.system_embedding_model_option }}" \
              systemEmbeddingModel="${{ steps.documentprocessor.outputs.system_embedding_model }}" \
              azureOpenAIEndpoint="$AZURE_OPENAI_ENDPOINT" \
              azureOpenAIEmbeddingsModel="${{ steps.documentprocessor.outputs.azure_openai_embeddings_model }}" \
              azureOpenAIApiVersion="${{ steps.documentprocessor.outputs.azure_openai_api_version }}" \
              azureOpenAIApiKey="$AZURE_OPENAI_API_KEY" \
              acrName="${{ steps.acr.outputs.acr_name }}" \
              storageAccountName="${{ steps.storage.outputs.storage_account_name }}" \
              storageContainerName="${{ steps.storage.outputs.storage_container_name }}" \
              logAnalyticsWorkspaceName="$AZURE_LOG_ANALYTICS_WORKSPACE_NAME" \
              applicationInsightsName="${{ steps.appinsights.outputs.application_insights_name }}" \
              managedIdentityName="$AZURE_MANAGED_IDENTITY_NAME" \
              createLogAnalyticsWorkspace="${{ steps.existing.outputs.create_log_analytics_workspace }}" \
              createManagedEnvironment="${{ steps.existing.outputs.create_managed_environment }}" \
              createAcr="${{ steps.existing.outputs.create_acr }}" \
              createStorageAccount="${{ steps.existing.outputs.create_storage_account }}" \
              createApplicationInsights="${{ steps.existing.outputs.create_application_insights }}" \
              createManagedIdentity="${{ steps.existing.outputs.create_managed_identity }}" \
              createPostgresServer="${{ steps.existing.outputs.create_postgres_server }}" \
              createContainerApp="${{ steps.existing.outputs.create_container_app }}" \
              createFrontendContainerApp="${{ steps.existing.outputs.create_frontend_container_app }}" \
              createDocumentProcessorJob="${{ steps.existing.outputs.create_document_processor_job }}" \
              createLawsCollectorJob="${{ steps.existing.outputs.create_laws_collector_job }}"

      - name: Summarize ACA infrastructure
        run: |
          api_result="reused"
          frontend_result="reused"
          document_processor_result="reused"
          laws_result="reused"
          env_result="reused"

          if [ "${{ steps.existing.outputs.create_managed_environment }}" = "true" ]; then
            env_result="created"
          fi
          if [ "${{ steps.existing.outputs.create_container_app }}" = "true" ]; then
            api_result="created"
          fi
          if [ "${{ steps.existing.outputs.create_frontend_container_app }}" = "true" ]; then
            frontend_result="created"
          fi
          if [ "${{ steps.existing.outputs.create_document_processor_job }}" = "true" ]; then
            document_processor_result="created"
          fi
          if [ "${{ steps.existing.outputs.create_laws_collector_job }}" = "true" ]; then
            laws_result="created"
          fi

          api_fqdn="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)"
          api_endpoint="n/a"
          if [ -n "$api_fqdn" ]; then
            api_endpoint="https://$api_fqdn"
          fi

          frontend_fqdn="$(az containerapp show \
            --name "$AZURE_FRONTEND_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)"
          frontend_endpoint="n/a"
          if [ -n "$frontend_fqdn" ]; then
            frontend_endpoint="https://$frontend_fqdn"
          fi

          {
            echo "## ACA deployment summary"
            echo ""
            echo "| Resource | Name | Result | Endpoint |"
            echo "| --- | --- | --- | --- |"
            echo "| Managed environment | $AZURE_CONTAINERAPPS_ENVIRONMENT | $env_result | n/a |"
            echo "| API container app | $AZURE_CONTAINER_APP_NAME | $api_result | $api_endpoint |"
            echo "| Frontend container app | $AZURE_FRONTEND_CONTAINER_APP_NAME | $frontend_result | $frontend_endpoint |"
            echo "| Document processor ACA job | ${{ steps.documentprocessor.outputs.document_processor_job_name }} | $document_processor_result | schedule: ${{ steps.documentprocessor.outputs.document_processor_cron_expression }} |"
            echo "| Laws collector ACA job | ${{ steps.laws.outputs.laws_job_name }} | $laws_result | schedule: ${{ steps.laws.outputs.laws_cron_expression }}, max probes: ${{ steps.laws.outputs.laws_max_probes }} |"
          } >> "$GITHUB_STEP_SUMMARY"
