name: mobile_flutter_build

on:
  workflow_dispatch:
    inputs:
      github_environment:
        description: "GitHub Environment that contains mobile API variables"
        required: true
        default: "dev"
      release:
        description: "Create GitHub Release and upload release APK asset"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile_flutter_build.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile_flutter_build.yml'

permissions:
  contents: write

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.github_environment || 'dev' }}

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Resolve API base URL
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL_VALUE='${{ vars.API_BASE_URL }}'
          if [ -z "$API_BASE_URL_VALUE" ]; then
            echo "Missing GitHub Environment variable: API_BASE_URL" >&2
            exit 1
          fi
          echo "API_BASE_URL=$API_BASE_URL_VALUE" >> "$GITHUB_ENV"
          echo "Using API_BASE_URL=$API_BASE_URL_VALUE"

      - name: Resolve app version for this build
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ -z "$RAW_VERSION" ]; then
            echo "Could not resolve app version from pubspec.yaml" >&2
            exit 1
          fi
          APP_VERSION="$RAW_VERSION"
          APP_BUILD_NAME="${RAW_VERSION%%+*}"
          if [ "$RAW_VERSION" = "$APP_BUILD_NAME" ]; then
            APP_BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          else
            APP_BUILD_NUMBER="${RAW_VERSION##*+}"
          fi
          RELEASE_ENABLED='${{ github.event_name == 'workflow_dispatch' && inputs.release || false }}'
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD_NAME=$APP_BUILD_NAME" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_ENABLED=$RELEASE_ENABLED" >> "$GITHUB_ENV"
          echo "Building APK version: ${APP_BUILD_NAME}+${APP_BUILD_NUMBER}"
          echo "GitHub release publish enabled: $RELEASE_ENABLED"

      - name: Prepare Android release signing
        shell: bash
        env:
          MOBILE_ANDROID_KEYSTORE_BASE64: ${{ secrets.MOBILE_ANDROID_KEYSTORE_BASE64 }}
          MOBILE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          MOBILE_ANDROID_KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          MOBILE_ANDROID_KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_BASE64="$(printf '%s' "${MOBILE_ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n')"
          KEYSTORE_PASSWORD="$(printf '%s' "${MOBILE_ANDROID_KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "${MOBILE_ANDROID_KEY_ALIAS}" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "${MOBILE_ANDROID_KEY_PASSWORD}" | tr -d '\r\n')"

          if [ -n "${KEYSTORE_BASE64}" ] && \
             [ -n "${KEYSTORE_PASSWORD}" ] && \
             [ -n "${KEY_ALIAS}" ] && \
             [ -n "${KEY_PASSWORD}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/aij-mobile-release.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

            if keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              {
                echo "ORG_GRADLE_PROJECT_aijReleaseKeystorePath=$KEYSTORE_PATH"
                echo "ORG_GRADLE_PROJECT_aijReleaseKeystorePassword=$KEYSTORE_PASSWORD"
                echo "ORG_GRADLE_PROJECT_aijReleaseKeyAlias=$KEY_ALIAS"
                echo "ORG_GRADLE_PROJECT_aijReleaseKeyPassword=$KEY_PASSWORD"
              } >> "$GITHUB_ENV"
              echo "Stable Android release signing configured."
            else
              RELEASE_ENABLED_VALUE='${{ github.event_name == 'workflow_dispatch' && inputs.release || false }}'
              if [ "$RELEASE_ENABLED_VALUE" = "true" ]; then
                echo "Android signing secrets are present but invalid for the selected keystore/alias." >&2
                echo "Verify MOBILE_ANDROID_KEYSTORE_BASE64, MOBILE_ANDROID_KEYSTORE_PASSWORD, MOBILE_ANDROID_KEY_ALIAS, and MOBILE_ANDROID_KEY_PASSWORD in the selected GitHub Environment." >&2
                exit 1
              fi

              echo "Android signing secrets are present but invalid; falling back to the debug signing key for this non-release CI build."
              echo "Verify MOBILE_ANDROID_KEYSTORE_BASE64, MOBILE_ANDROID_KEYSTORE_PASSWORD, MOBILE_ANDROID_KEY_ALIAS, and MOBILE_ANDROID_KEY_PASSWORD in the selected GitHub Environment."
            fi
          else
            RELEASE_ENABLED_VALUE='${{ github.event_name == 'workflow_dispatch' && inputs.release || false }}'
            if [ "$RELEASE_ENABLED_VALUE" = "true" ]; then
              echo "Android release signing secrets are not fully configured for the selected GitHub Environment." >&2
              echo "A published mobile release must never fall back to an ephemeral debug signing key." >&2
              exit 1
            fi

            echo "Android release signing secrets not fully configured; falling back to the debug signing key for this non-release CI build."
          fi

      - name: Install dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "flutter pub get attempt $attempt/3"
            if flutter pub get --verbose; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Clearing local resolution cache before retry..."
              rm -rf .dart_tool
              rm -rf "$HOME/.pub-cache/hosted" "$HOME/.pub-cache/git"
              sleep 15
            fi
          done
          echo "flutter pub get failed after 3 attempts" >&2
          exit 1


      - name: Generate missing platform scaffolding
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --platforms=android,web --project-name ai_jurisdiction_mobile
          fi


      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-name=$APP_BUILD_NAME --build-number=$APP_BUILD_NUMBER --dart-define=AIJ_API_BASE_URL=$API_BASE_URL

      - name: Build APK (debug, installable fallback)
        run: flutter build apk --debug --build-name=$APP_BUILD_NAME --build-number=$APP_BUILD_NUMBER --dart-define=AIJ_API_BASE_URL=$API_BASE_URL

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-jurisdiction-mobile-apk-release-${{ github.run_number }}
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: ai-jurisdiction-mobile-apk-debug-${{ github.run_number }}
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish GitHub Release with APK
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: MobileApp ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          make_latest: true
          overwrite_files: true
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web bundle
        run: flutter build web --release --dart-define=AIJ_API_BASE_URL=$API_BASE_URL

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-jurisdiction-mobile-web
          path: mobile_app/build/web
