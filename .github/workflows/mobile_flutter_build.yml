name: mobile_flutter_build

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile_flutter_build.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile_flutter_build.yml'

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://10.0.2.2:8080' }}

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Print build API base URL
        run: echo "Using API_BASE_URL=$API_BASE_URL"

      - name: Build APK
        run: flutter build apk --release --dart-define=AIJ_API_BASE_URL=$API_BASE_URL

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-jurisdiction-mobile-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web bundle
        run: flutter build web --release --dart-define=AIJ_API_BASE_URL=$API_BASE_URL

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-jurisdiction-mobile-web
          path: mobile_app/build/web
