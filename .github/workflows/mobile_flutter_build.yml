name: mobile_flutter_build

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile_flutter_build.yml'
  pull_request:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile_flutter_build.yml'

jobs:
  build-mobile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Resolve API base URL
        shell: bash
        run: |
          set -euo pipefail
          API_BASE_URL_VALUE='${{ vars.API_BASE_URL }}'
          if [ -z "$API_BASE_URL_VALUE" ]; then
            API_BASE_URL_VALUE='http://10.0.2.2:8080'
          fi
          echo "API_BASE_URL=$API_BASE_URL_VALUE" >> "$GITHUB_ENV"
          echo "Using API_BASE_URL=$API_BASE_URL_VALUE"

      - name: Install dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "flutter pub get attempt $attempt/3"
            if flutter pub get --verbose; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Clearing local resolution cache before retry..."
              rm -rf .dart_tool
              rm -rf "$HOME/.pub-cache/hosted" "$HOME/.pub-cache/git"
              sleep 15
            fi
          done
          echo "flutter pub get failed after 3 attempts" >&2
          exit 1


      - name: Generate missing platform scaffolding
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --platforms=android,web --project-name ai_jurisdiction_mobile
          fi


      - name: Normalize Android build config
        shell: bash
        run: |
          set -euo pipefail
          if [ -f android/settings.gradle ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            if grep -q 'compileSdk = flutter.compileSdkVersion' android/app/build.gradle; then
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
            elif grep -q 'compileSdkVersion flutter.compileSdkVersion' android/app/build.gradle; then
              sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle
            fi
          fi

      - name: Ensure Android SDK 35 components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=AIJ_API_BASE_URL=$API_BASE_URL

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-jurisdiction-mobile-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web bundle
        run: flutter build web --release --dart-define=AIJ_API_BASE_URL=$API_BASE_URL

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-jurisdiction-mobile-web
          path: mobile_app/build/web
