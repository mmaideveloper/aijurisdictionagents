name: web_build_deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/aijurisdictionfronend/**"
      - "frontend/aijurisdictionfronend/Dockerfile"
      - ".github/workflows/web_build_deploy.yml"
  pull_request:
    paths:
      - "frontend/aijurisdictionfronend/**"
      - "frontend/aijurisdictionfronend/Dockerfile"
      - ".github/workflows/web_build_deploy.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy frontend to Azure Container Apps"
        required: true
        default: "true"
      github_environment:
        description: "GitHub Environment that contains Azure variables"
        required: true
        default: "dev"

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/aijurisdictionfronend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/aijurisdictionfronend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  deploy_to_azure:
    runs-on: ubuntu-latest
    needs: test_and_build
    if: inputs.deploy == 'true'
    environment: ${{ inputs.github_environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINERAPPS_ENVIRONMENT }}
      AZURE_FRONTEND_CONTAINER_APP_NAME: ${{ vars.AZURE_FRONTEND_CONTAINER_APP_NAME }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINERAPPS_ENVIRONMENT AZURE_FRONTEND_CONTAINER_APP_NAME AZURE_CONTAINER_REGISTRY; do
            if [ -z "${!key}" ]; then
              echo "Missing GitHub Environment variable: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Normalize ACR settings
        id: acr
        run: |
          raw="$AZURE_CONTAINER_REGISTRY"
          lowered="$(echo "$raw" | tr '[:upper:]' '[:lower:]')"
          no_suffix="${lowered%.azurecr.io}"
          acr_name="$(echo "$no_suffix" | tr -cd 'a-z0-9')"

          if [ -z "$acr_name" ] || [ "${#acr_name}" -lt 5 ] || [ "${#acr_name}" -gt 50 ]; then
            echo "::error::Invalid ACR value '$raw'. Normalized name '$acr_name' must be 5-50 alphanumeric characters."
            exit 1
          fi

          if [ "$raw" != "$acr_name" ] && [ "$raw" != "${acr_name}.azurecr.io" ]; then
            echo "::warning::Normalized AZURE_CONTAINER_REGISTRY from '$raw' to '$acr_name'."
          fi

          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${acr_name}.azurecr.io" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Azure Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Configure Container App ACR pull auth
        run: |
          app_name="${AZURE_FRONTEND_CONTAINER_APP_NAME}"
          rg="${AZURE_RESOURCE_GROUP}"
          acr_name="${{ steps.acr.outputs.acr_name }}"
          acr_server="${{ steps.acr.outputs.acr_login_server }}"

          acr_id="$(az acr show --name "$acr_name" --query id --output tsv)"
          user_identity_id="$(az containerapp show --name "$app_name" --resource-group "$rg" --query "keys(identity.userAssignedIdentities)[0]" --output tsv 2>/dev/null || true)"

          if [ -n "$user_identity_id" ] && [ "$user_identity_id" != "null" ]; then
            principal_id="$(az identity show --ids "$user_identity_id" --query principalId --output tsv)"
            registry_identity="$user_identity_id"
          else
            identity_type="$(az containerapp show --name "$app_name" --resource-group "$rg" --query "identity.type" --output tsv 2>/dev/null || true)"
            if [[ "$identity_type" != *"SystemAssigned"* ]]; then
              az containerapp identity assign --name "$app_name" --resource-group "$rg" --system-assigned --only-show-errors --output none
            fi
            principal_id="$(az containerapp show --name "$app_name" --resource-group "$rg" --query "identity.principalId" --output tsv)"
            registry_identity="system"
          fi

          role_count="$(az role assignment list --assignee-object-id "$principal_id" --scope "$acr_id" --query "[?roleDefinitionName=='AcrPull'] | length(@)" --output tsv)"
          if [ "$role_count" = "0" ]; then
            az role assignment create \
              --assignee-object-id "$principal_id" \
              --assignee-principal-type ServicePrincipal \
              --scope "$acr_id" \
              --role AcrPull \
              --only-show-errors \
              --output none
          fi

          az containerapp registry set \
            --name "$app_name" \
            --resource-group "$rg" \
            --server "$acr_server" \
            --identity "$registry_identity" \
            --only-show-errors \
            --output none

      - name: Build and push image to ACR
        run: |
          az acr login --name ${{ steps.acr.outputs.acr_name }}
          docker build -f frontend/aijurisdictionfronend/Dockerfile -t ${{ steps.acr.outputs.acr_login_server }}/aijurisdiction-frontend:${{ github.sha }} frontend/aijurisdictionfronend
          docker push ${{ steps.acr.outputs.acr_login_server }}/aijurisdiction-frontend:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ steps.acr.outputs.acr_name }}
          containerAppName: ${{ env.AZURE_FRONTEND_CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.AZURE_CONTAINERAPPS_ENVIRONMENT }}
          imageToDeploy: ${{ steps.acr.outputs.acr_login_server }}/aijurisdiction-frontend:${{ github.sha }}
