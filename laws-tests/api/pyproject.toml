[project]
name = "jurisdigta-laws-tests"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.116.1", "uvicorn>=0.35", "psycopg[binary]>=3.2", "python-dotenv>=1.0", "openai>=1.0", "httpx>=0.28.1", "truststore>=0.10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["laws_tests"]

[tool.ruff]
extend = "../ruff.toml"
line-length = 110
