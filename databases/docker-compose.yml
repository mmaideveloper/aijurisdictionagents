services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aijurisdiction-postgres-local
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-aijurisdiction}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgress/data:/var/lib/postgresql/data
      - ./postgress/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-postgres} -d ${LOCAL_POSTGRES_DB:-aijurisdiction}"]
      interval: 10s
      timeout: 5s
      retries: 5
