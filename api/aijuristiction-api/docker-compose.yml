services:
  postgres:
    image: postgres:16-alpine
    container_name: aijurisdiction-postgres
    environment:
      POSTGRES_DB: aijurisdiction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aijurisdiction"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aijuristiction-api:local
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_OPTION=postgres
      - DB_CLOUD=postgresql://postgres:postgres@postgres:5432/aijurisdiction
      - STORAGE_OPTION=local
      - DB_LOCAL=/app/data/api.sqlite3
      - STORE_LOCAL=/app/blob
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./databases:/app/data
      - ./storage:/app/blob

volumes:
  postgres_data:
