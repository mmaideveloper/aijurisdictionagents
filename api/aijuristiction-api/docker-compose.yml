services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aijurisdiction-postgres
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-aijurisdiction}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../../runs/storage/api/postgres/data:/var/lib/postgresql/data
      - ../../databases/api/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-postgres} -d ${LOCAL_POSTGRES_DB:-aijurisdiction}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: jurisdigta-api
    build:
      context: ../..
      dockerfile: api/aijuristiction-api/Dockerfile
    image: aijuristiction-api:local
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_OPTION: postgres
      DB_CLOUD: postgresql://${LOCAL_POSTGRES_USER:-postgres}:${LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/${LOCAL_POSTGRES_DB:-aijurisdiction}
      STORAGE_OPTION: local
      DB_LOCAL: /workspace/runs/storage/api/sqlite/api.sqlite3
      STORE_LOCAL: /workspace/runs/storage/api/files
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../runs:/workspace/runs

  mcp:
    container_name: jurisdigta-mcp
    build:
      context: ../..
      dockerfile: api/aijuristiction-api/Dockerfile
    image: aijuristiction-api:local
    command: ["uvicorn", "app.mcp_main:app", "--host", "0.0.0.0", "--port", "8070"]
    ports:
      - "${MCP_PORT:-8070}:8070"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_OPTION: postgres
      DB_CLOUD: postgresql://${LOCAL_POSTGRES_USER:-postgres}:${LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/${LOCAL_POSTGRES_DB:-aijurisdiction}
      STORAGE_OPTION: local
      DB_LOCAL: /workspace/runs/storage/api/sqlite/api.sqlite3
      STORE_LOCAL: /workspace/runs/storage/api/files
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MCP_CORS_ALLOW_ORIGINS: ${MCP_CORS_ALLOW_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../runs:/workspace/runs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
