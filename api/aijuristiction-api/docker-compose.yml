services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aijurisdiction-postgres
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-aijurisdiction}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-postgres}
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../../databases/postgress/data:/var/lib/postgresql/data
      - ../../databases/postgress/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_POSTGRES_USER:-postgres} -d ${LOCAL_POSTGRES_DB:-aijurisdiction}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: api/aijuristiction-api/Dockerfile
    image: aijuristiction-api:local
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_OPTION: postgres
      DB_CLOUD: postgresql://${LOCAL_POSTGRES_USER:-postgres}:${LOCAL_POSTGRES_PASSWORD:-postgres}@postgres:5432/${LOCAL_POSTGRES_DB:-aijurisdiction}
      STORAGE_OPTION: local
      DB_LOCAL: /workspace/databases/api.sqlite3
      STORE_LOCAL: /workspace/api/aijuristiction-api/storage
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../databases:/workspace/databases
      - ./storage:/workspace/api/aijuristiction-api/storage
