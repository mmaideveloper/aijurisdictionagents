# LAN-only Ollama proxy for jurisdigta-server.
# This listener must never be exposed through router NAT or Cloudflare Tunnel.
server {
    listen 192.168.1.25:11434;
    server_name _;

    allow 192.168.1.0/24;
    deny all;

    client_max_body_size 100m;

    location / {
        proxy_pass http://172.18.0.1:11434;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
