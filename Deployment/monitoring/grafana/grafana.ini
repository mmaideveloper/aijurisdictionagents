; Personal reporting is available only in the private admin organization.
[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = false
viewers_can_edit = false

[snapshots]
enabled = false
external_enabled = false

[public_dashboards]
enabled = false

[server]
; Authenticated actor/org, method, path, status and timing; never enable body/SQL logging.
router_logging = true
