x-jurisdigta-logging: &jurisdigta-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-50m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: jurisdigta-prometheus
    restart: unless-stopped
    logging: *jurisdigta-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-30}d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - status-exporter
      - ollama-exporter
      - node-exporter
      - cadvisor
      - blackbox-exporter

  ollama-exporter:
    image: python:3.11-slim
    container_name: jurisdigta-ollama-exporter
    restart: unless-stopped
    logging: *jurisdigta-logging
    network_mode: host
    working_dir: /app
    env_file:
      - .env
    environment:
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://127.0.0.1:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:1.7b}
    command:
      - python
      - /app/export_ollama_metrics.py
      - --host
      - 0.0.0.0
      - --port
      - "9109"
      - --ollama-url
      - ${LOCAL_LLM_BASE_URL:-http://127.0.0.1:11434}
    volumes:
      - ../../scripts/server/export_ollama_metrics.py:/app/export_ollama_metrics.py:ro

  status-exporter:
    image: python:3.11-slim
    container_name: jurisdigta-status-exporter
    restart: unless-stopped
    logging: *jurisdigta-logging
    working_dir: /app
    env_file:
      - .env
    environment:
      API_KEY: ${JURISDIGTA_API_KEY:-${API_KEY:-aijuris}}
      SYSTEM_STATUS_FILE: /workspace/runs/status/system-status.json
    command:
      - python
      - /app/export_system_status_metrics.py
      - --host
      - 0.0.0.0
      - --port
      - "9108"
      - --status-url
      - http://jurisdigta-api:8080/v1/system/status?minutes=60
    volumes:
      - ../../scripts/server/export_system_status_metrics.py:/app/export_system_status_metrics.py:ro
      - ../../runs:/workspace/runs:ro
    networks:
      - default
      - app-network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: jurisdigta-grafana
    restart: unless-stopped
    logging: *jurisdigta-logging
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_SERVER_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: ${GRAFANA_DEFAULT_HOME_DASHBOARD_PATH:-/var/lib/grafana/dashboards/jurisdigta-application-performance.json}
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GRAFANA_SMTP_FROM_NAME:-JurisDigta Grafana}
      GF_SMTP_STARTTLS_POLICY: ${GRAFANA_SMTP_STARTTLS_POLICY:-OpportunisticStartTLS}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    container_name: jurisdigta-loki
    restart: unless-stopped
    logging: *jurisdigta-logging
    command:
      - --config.file=/etc/loki/loki.yml
      - --config.expand-env=true
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-7}
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:latest
    container_name: jurisdigta-alloy
    restart: unless-stopped
    logging: *jurisdigta-logging
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_HOST_PORT:-12345}:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../runs/logs:/srv/jurisdigta/runs/logs:ro
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    container_name: jurisdigta-node-exporter
    restart: unless-stopped
    logging: *jurisdigta-logging
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: jurisdigta-cadvisor
    restart: unless-stopped
    logging: *jurisdigta-logging
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: jurisdigta-blackbox-exporter
    restart: unless-stopped
    logging: *jurisdigta-logging
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - default
      - app-network

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  app-network:
    external: true
    name: ${MONITORING_APP_DOCKER_NETWORK:-aijuristiction-api_default}
