# JurisDigta Grafana reverse proxy.
#
# Install on jurisdigta-server as:
#   /etc/nginx/sites-available/jurisdigta-admin-grafana.conf
#   /etc/nginx/sites-enabled/jurisdigta-admin-grafana.conf
#
# Prerequisites:
# - admin.jurisdigta.eu points to the public IP/NAT endpoint for jurisdigta-server.
# - Router forwards TCP 80 and 443 to jurisdigta-server.
# - Certbot certificate exists for admin.jurisdigta.eu.

server {
    listen 80;
    listen [::]:80;
    server_name admin.jurisdigta.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.jurisdigta.eu;

    ssl_certificate /etc/letsencrypt/live/admin.jurisdigta.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.jurisdigta.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location = / {
        return 302 /grafana/;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
