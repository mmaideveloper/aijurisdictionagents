global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: jurisdigta-status
    scrape_interval: 30s
    static_configs:
      - targets:
          - status-exporter:9108

  - job_name: jurisdigta-http-probes
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://host.docker.internal:8080/health
        labels:
          service: jurisdigta-api
          component: api
      - targets:
          - http://host.docker.internal:8070/health
        labels:
          service: jurisdigta-mcp
          component: mcp
      - targets:
          - https://web.jurisdigta.eu/health
        labels:
          service: jurisdigta-web
          component: web
      - targets:
          - http://grafana:3000/grafana/api/health
        labels:
          service: jurisdigta-grafana
          component: monitoring
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
